<header><h1>Exercise 8.1 – Enabling/Disabling JavaScript</h1></header>
<div class="movingDiv" id="div1">
  <script>
    // Chỉ chạy khi JavaScript đang bật
    document.write("<strong>You have JavaScript enabled</strong>");
  </script>
  <noscript><strong>You have JavaScript disabled</strong></noscript>
</div>
<p class="note">Thử tắt JavaScript trong trình duyệt (Chrome/Edge: Settings → Privacy and security → Site settings → JavaScript → Don't allow) rồi tải lại trang để thấy thông báo đổi từ "enabled" sang "disabled".</p>
